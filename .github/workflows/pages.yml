name: Publish Classic 60 Preview

on:
    push:
        branches:
            - forever
    workflow_dispatch:

# Build and test jobs do not receive a publishing token. Never add a PR trigger
# here: pull requests exercise the same preview build in run_tests.yml.
permissions:
    contents: read

concurrency:
    group: classic-60-pages
    cancel-in-progress: false

jobs:
    validate:
        if: github.repository == 'Zwyk/wowsims-forever' && github.ref == 'refs/heads/forever' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: ./.github/workflows/run_tests.yml

    build:
        needs: validate
        if: github.repository == 'Zwyk/wowsims-forever' && github.ref == 'refs/heads/forever' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            pages: read
        steps:
            - name: Checkout the validated commit
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - name: Check workflow policy
              run: ./tools/ci/check_workflow_policy.sh

            - name: Install Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: 1.25.4

            - name: Install Protoc
              uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
              with:
                  version: '29.3'
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10

            - name: Install Node
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version-file: .nvmrc

            - name: Build and smoke-test Classic 60 diagnostic
              run: |
                  make sim/core/proto/api.pb.go
                  node tools/classic60preview/build.mjs
                  node tools/classic60preview/smoke.mjs dist/forever-preview
                  node tools/ci/check_pages_artifact.mjs dist/forever-preview

            # This only reads Pages metadata; it does not enable Pages or change
            # repository settings. Select GitHub Actions in Settings > Pages.
            - name: Check Pages configuration
              uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
              with:
                  enablement: false

            - name: Upload the validated static artifact
              uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
              with:
                  path: dist/forever-preview
                  retention-days: 1

    deploy:
        needs: [validate, build]
        if: github.repository == 'Zwyk/wowsims-forever' && github.ref == 'refs/heads/forever' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            # No checkout or execution of repository code in the privileged job.
            - name: Deploy to this repository's GitHub Pages site
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
